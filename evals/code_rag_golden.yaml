- id: web_ui_negative
  category: negative
  difficulty: easy
  question: 这个项目是否实现了 Web UI 或 HTTP API？
  expected_files: []
  expected_symbols: []

- id: list_status_remove
  category: ambiguity
  difficulty: easy
  question: code-rag list、status、remove 各自做什么？
  expected_files:
    - src/code_rag/cli.py
    - src/code_rag/services/manifest_service.py
  expected_symbols:
    - list_repos
    - status
    - remove
    - ManifestService

- id: hybrid_retrieval
  category: workflow
  difficulty: medium
  question: 混合检索怎么把向量和词法召回融合？
  expected_files:

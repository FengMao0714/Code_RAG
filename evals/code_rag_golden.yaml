# Golden Query 数据集 — Code_RAG 项目自评
#
# 每条问题覆盖一个核心概念：
# - 符号定位
# - 配置定位
# - 流程解释
# - 边界 / 负样本 / 歧义样本
#
# 注意：expected_files 中的相对路径均相对当前仓库根目录；
# evaluator 会对这些路径做归一化（小写 + 反斜杠转斜杠）后比较。

- id: cli_entry
  category: symbol_location
  difficulty: easy
  question: CLI 入口在哪里？
  expected_files:
    - src/code_rag/cli.py
    - pyproject.toml
  expected_symbols:
    - app

- id: project_scripts
  category: config_location
  difficulty: easy
  mode: lexical
  question: pyproject.toml 中的 [project.scripts] 和 code-rag 入口是如何定义的？
  expected_files:
    - pyproject.toml
  expected_symbols:
    - scripts
    - code-rag


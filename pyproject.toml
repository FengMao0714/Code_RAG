[project]
name = "code-rag"
version = "0.1.0"
description = "代码知识库 RAG 问答助手 — 基于代码仓库的智能问答 CLI 工具"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # CLI 框架
    "typer>=0.12",
    "rich>=13.0",
    # 向量数据库
    "chromadb>=0.5",
    # 代码解析
    "tree-sitter>=0.23",
    "tree-sitter-languages>=1.10",
    # LLM 调用 (OpenAI 兼容接口)
    "openai>=1.0",
    # 本地 Embedding
    "sentence-transformers>=3.0",
    # 配置管理
    "pydantic-settings>=2.0",
    # Git 操作
    "gitpython>=3.1",
    # Token 计数
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
code-rag = "code_rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_rag"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
